<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block content %}
    {% if products %}
    <div class="row">
        {% for p in products %}
        <div class="col-md-4 col-8 p-2">

            <div class="card" >
                <img class="card-img-top" src={{ p.image }} alt="Card image">
                <div class="card-body">
                    <h4 class="card-title">{{ p.name }}</h4>
                    <p class="card-text">{{ p.price }}</p>
                    <a href="#" class="btn btn-primary">xem chi tiet</a>
                    <button class="btn btn-danger"> Đặt hàng
                    </button>
                </div>
            </div>
        </div>
        {%endfor%}
    </div>
    {% else %}
        <div class =" alert alert-warning mt-2 "> khoong co sna pham nao</div>
    {% endif %}
 {% endblock %}</title>
</head>
<body>

</body>
</html>
